name: Deploy Icon Browser to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      # Renders example diagrams to site/examples/ using the bundled PlantUML
      # JAR and the committed dist/ icons (current release only). The PNGs live
      # only in the Pages artifact, never in source control.
      - run: uv run scripts/generate_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
